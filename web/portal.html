<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade</title>
    <link rel="stylesheet" href="/shared.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <div class="subtitle">Server Index</div>
          <h1>Arcade</h1>
        </div>
      </header>

      <section class="layout">
        <div class="server-list" id="server-list"></div>
        <div class="server-detail" id="server-detail"></div>
      </section>
    </div>
    <script>
      const serverList = document.getElementById("server-list");
      const serverDetail = document.getElementById("server-detail");
      const statusLabels = {
        live: "Running",
        starting: "Unknown",
        offline: "Stopped",
      };
      const serverStateMap = { running: "live", stopped: "offline", unknown: "starting" };
      // Every action a server registers gets a button in the detail pane --
      // the list itself never shows any controls, only name + status. This
      // label map is just cosmetic; an action not listed here still renders,
      // using its raw name as the fallback label.
      const actionLabels = { start: "Start", stop: "Stop" };

      const runServerAction = async (serverId, action, button, errorEl, body) => {
        button.disabled = true;
        const original = button.textContent;
        button.textContent = "…";
        if (errorEl) {
          errorEl.hidden = true;
          errorEl.textContent = "";
        }
        try {
          const res = await fetch(`/api/servers/${encodeURIComponent(serverId)}/actions/${encodeURIComponent(action)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body || {}),
          });
          const payload = await res.json().catch(() => ({}));
          if (errorEl && (!res.ok || payload.ok === false)) {
            errorEl.textContent = payload.error || `${action} failed (HTTP ${res.status})`;
            errorEl.hidden = false;
          }
        } catch (err) {
          if (errorEl) {
            errorEl.textContent = `${action} failed: could not reach the portal`;
            errorEl.hidden = false;
          }
        } finally {
          button.disabled = false;
          button.textContent = original;
          refreshServers();
        }
      };

      // Keyed by server id so a refresh updates existing rows/the detail
      // pane in place instead of tearing down and recreating them -- a
      // full rebuild every poll replayed CSS entrance animations, making
      // the page visibly "bounce" on every refresh (fixed once already
      // for the old card grid; the same discipline applies here).
      const rowsById = new Map();
      let selectedId = null;
      let lastServers = [];
      let emptyListMessage = null;
      let detailEntry = null;

      const applySelectionHighlight = () => {
        rowsById.forEach((entry, id) => {
          entry.row.classList.toggle("selected", id === selectedId);
        });
      };

      const buildListRow = (server) => {
        const row = document.createElement("div");
        row.className = "list-row";
        row.addEventListener("click", () => {
          selectedId = server.id;
          if (detailEntry) {
            detailEntry.error.hidden = true;
            detailEntry.error.textContent = "";
          }
          applySelectionHighlight();
          renderDetailForSelected();
        });

        const title = document.createElement("span");
        title.className = "list-row-name";
        const status = document.createElement("span");

        row.appendChild(title);
        row.appendChild(status);

        const entry = { row, title, status };
        updateListRow(entry, server);
        return entry;
      };

      const updateListRow = (entry, server) => {
        const name = server.name || server.id;
        if (entry.title.textContent !== name) entry.title.textContent = name;

        const state = serverStateMap[server.status] || "starting";
        const statusClass = `status-pill ${state}`;
        if (entry.status.className !== statusClass) entry.status.className = statusClass;
        const statusText = statusLabels[state] || server.status || "Unknown";
        if (entry.status.textContent !== statusText) entry.status.textContent = statusText;
      };

      // start/stop are always pinned at the top of the detail pane, in a
      // fixed, stable position -- everything else a server registers is
      // "server-specific" and goes in its own labeled section below, so
      // the two are never visually mixed together.
      const PRIMARY_ACTIONS = ["start", "stop"];

      const buildDetailPane = () => {
        const pane = document.createElement("div");
        pane.className = "detail-pane";

        const header = document.createElement("div");
        header.className = "card-header";
        const title = document.createElement("h2");
        const status = document.createElement("span");
        header.appendChild(title);
        header.appendChild(status);

        const description = document.createElement("p");
        description.className = "pending";

        // Adapter-reported live stats -- an opaque ordered list of
        // {label, value} pairs. The portal never interprets these; it
        // just renders whatever the adapter sent, so a server with no
        // stats yet (or an adapter that never adds any) simply shows
        // nothing here.
        const statsHeading = document.createElement("div");
        statsHeading.className = "subtitle section-heading";
        statsHeading.textContent = "Live Stats";
        statsHeading.hidden = true;

        const stats = document.createElement("div");
        stats.className = "status-grid";

        const error = document.createElement("p");
        error.className = "error";
        error.hidden = true;

        const primaryControls = document.createElement("div");
        primaryControls.className = "controls";

        const secondaryHeading = document.createElement("div");
        secondaryHeading.className = "subtitle section-heading";
        secondaryHeading.textContent = "Server Controls";
        secondaryHeading.hidden = true;

        const secondaryControls = document.createElement("div");
        secondaryControls.className = "controls";

        pane.appendChild(header);
        pane.appendChild(description);
        pane.appendChild(statsHeading);
        pane.appendChild(stats);
        pane.appendChild(primaryControls);
        pane.appendChild(secondaryHeading);
        pane.appendChild(secondaryControls);
        pane.appendChild(error);

        serverDetail.innerHTML = "";
        serverDetail.appendChild(pane);

        return {
          pane,
          title,
          status,
          description,
          statsHeading,
          stats,
          error,
          primaryControls,
          secondaryControls,
          secondaryHeading,
          primaryActions: [],
          secondaryActions: [],
          secondaryOffline: null,
          statsSignature: null,
        };
      };

      // One input builder per fixed primitive param type -- deliberately
      // not open-ended. An adapter describes *what kind* of value it
      // wants (enum/boolean/number/string); it never dictates markup or
      // validation beyond that, so this stays a small closed switch.
      const PARAM_INPUT_BUILDERS = {
        enum: (param) => {
          const select = document.createElement("select");
          (param.options || []).forEach((opt) => {
            const option = document.createElement("option");
            option.value = opt;
            option.textContent = opt;
            select.appendChild(option);
          });
          if (param.default !== undefined) select.value = param.default;
          return { el: select, getValue: () => select.value };
        },
        boolean: (param) => {
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(param.default);
          return { el: input, getValue: () => input.checked };
        },
        number: (param) => {
          const input = document.createElement("input");
          input.type = "number";
          if (param.min !== undefined) input.min = param.min;
          if (param.max !== undefined) input.max = param.max;
          if (param.default !== undefined) input.value = param.default;
          return { el: input, getValue: () => input.valueAsNumber };
        },
        string: (param) => {
          const input = document.createElement("input");
          input.type = "text";
          if (param.default !== undefined) input.value = param.default;
          return { el: input, getValue: () => input.value };
        },
      };

      // A parameterized action ({name, label, params}) renders as a small
      // inline form instead of a bare button -- one input per param, an
      // Apply button that collects the current values into the POST body.
      // The portal has no idea what any of this means; it just maps
      // param.type to an input widget.
      const buildParamAction = (action, serverId, errorEl) => {
        const wrap = document.createElement("div");
        wrap.className = "param-action";

        const label = document.createElement("span");
        label.className = "param-action-label";
        label.textContent = action.label || action.name;
        wrap.appendChild(label);

        const getters = [];
        (action.params || []).forEach((param) => {
          const build = PARAM_INPUT_BUILDERS[param.type] || PARAM_INPUT_BUILDERS.string;
          const { el, getValue } = build(param);
          el.name = param.name;
          if (param.label) el.title = param.label;
          wrap.appendChild(el);
          getters.push(() => [param.name, getValue()]);
        });

        const button = document.createElement("button");
        button.className = "link-button";
        button.textContent = "Apply";
        button.addEventListener("click", () => {
          const body = Object.fromEntries(getters.map((get) => get()));
          runServerAction(serverId, action.name, button, errorEl, body);
        });
        wrap.appendChild(button);

        return wrap;
      };

      const fillControls = (container, actions, serverId, errorEl) => {
        container.innerHTML = "";
        actions.forEach((action) => {
          if (action && typeof action === "object") {
            container.appendChild(buildParamAction(action, serverId, errorEl));
            return;
          }
          const button = document.createElement("button");
          button.className = "link-button";
          button.textContent = actionLabels[action] || action;
          button.addEventListener("click", () => runServerAction(serverId, action, button, errorEl));
          container.appendChild(button);
        });
      };

      const setControlsDisabled = (container, disabled) => {
        Array.from(container.children).forEach((button) => {
          button.disabled = disabled;
        });
      };

      // Content comparison, not reference -- a parameterized action is an
      // object freshly re-parsed from JSON every poll, so `===` would
      // never match even when nothing changed, rebuilding (and resetting)
      // any in-progress form on every 4s tick.
      const sameActions = (a, b) => JSON.stringify(a) === JSON.stringify(b);

      const renderStats = (entry, stats) => {
        const signature = JSON.stringify(stats);
        if (signature === entry.statsSignature) return;
        entry.statsSignature = signature;
        entry.stats.innerHTML = "";
        stats.forEach((stat) => {
          const item = document.createElement("div");
          item.className = "status-item";
          const value = document.createElement("div");
          value.textContent = stat.value;
          const label = document.createElement("span");
          label.textContent = stat.label;
          item.appendChild(value);
          item.appendChild(label);
          entry.stats.appendChild(item);
        });
        entry.statsHeading.hidden = stats.length === 0;
      };

      const updateDetailPane = (entry, server) => {
        const name = server.name || server.id;
        if (entry.title.textContent !== name) entry.title.textContent = name;

        const state = serverStateMap[server.status] || "starting";
        const statusClass = `status-pill ${state}`;
        if (entry.status.className !== statusClass) entry.status.className = statusClass;
        const statusText = statusLabels[state] || server.status || "Unknown";
        if (entry.status.textContent !== statusText) entry.status.textContent = statusText;

        const description = server.description || "";
        if (entry.description.textContent !== description) entry.description.textContent = description;

        renderStats(entry, server.stats || []);

        // Every action a server registers -- and only these, the list
        // view never shows action buttons -- renders here, split into
        // start/stop (always first, always visible in the same spot)
        // and everything else (a separate, clearly-labeled section).
        const actions = server.actions || [];
        const primaryActions = actions.filter((a) => PRIMARY_ACTIONS.includes(a));
        const secondaryActions = actions.filter((a) => !PRIMARY_ACTIONS.includes(a));

        if (!sameActions(primaryActions, entry.primaryActions)) {
          fillControls(entry.primaryControls, primaryActions, server.id, entry.error);
          entry.primaryActions = primaryActions;
        }
        // Server-specific controls don't mean anything while the server
        // itself is offline -- start is still the only useful action at
        // that point, so grey the rest out rather than let them fail.
        // Start/stop are deliberately exempt: start is exactly what you
        // need to click while offline.
        const isOffline = state === "offline";
        if (!sameActions(secondaryActions, entry.secondaryActions)) {
          fillControls(entry.secondaryControls, secondaryActions, server.id, entry.error);
          entry.secondaryActions = secondaryActions;
          entry.secondaryHeading.hidden = secondaryActions.length === 0;
          entry.secondaryOffline = null; // force re-applying disabled state on fresh buttons
        }
        if (entry.secondaryOffline !== isOffline) {
          setControlsDisabled(entry.secondaryControls, isOffline);
          entry.secondaryOffline = isOffline;
        }
      };

      const renderEmptyDetail = (message) => {
        serverDetail.innerHTML = "";
        detailEntry = null;
        const pane = document.createElement("div");
        pane.className = "detail-pane";
        const p = document.createElement("p");
        p.className = "pending";
        p.textContent = message;
        pane.appendChild(p);
        serverDetail.appendChild(pane);
      };

      const renderDetailForSelected = () => {
        const server = lastServers.find((s) => s.id === selectedId);
        if (!server) {
          renderEmptyDetail("Select a server to see details.");
          return;
        }
        if (!detailEntry) {
          detailEntry = buildDetailPane();
        }
        updateDetailPane(detailEntry, server);
      };

      const renderServers = (servers) => {
        lastServers = servers;

        if (!servers.length) {
          rowsById.forEach((entry) => entry.row.remove());
          rowsById.clear();
          selectedId = null;
          if (!emptyListMessage) {
            emptyListMessage = document.createElement("p");
            emptyListMessage.className = "pending";
            emptyListMessage.textContent = "No servers registered.";
            serverList.appendChild(emptyListMessage);
          }
          renderEmptyDetail("No servers registered.");
          return;
        }

        if (emptyListMessage) {
          emptyListMessage.remove();
          emptyListMessage = null;
        }

        // Default selection to the first server, or fall back to it if
        // the previously-selected server has disappeared.
        if (!selectedId || !servers.some((s) => s.id === selectedId)) {
          selectedId = servers[0].id;
        }

        const seen = new Set();
        servers.forEach((server) => {
          seen.add(server.id);
          let entry = rowsById.get(server.id);
          if (!entry) {
            entry = buildListRow(server);
            rowsById.set(server.id, entry);
          } else {
            updateListRow(entry, server);
          }
          // appendChild on a node already in the DOM moves it rather than
          // recreating it, so this keeps ordering in sync with the API
          // response without retriggering any entrance animation.
          serverList.appendChild(entry.row);
        });

        rowsById.forEach((entry, id) => {
          if (!seen.has(id)) {
            entry.row.remove();
            rowsById.delete(id);
          }
        });

        applySelectionHighlight();
        renderDetailForSelected();
      };

      const refreshServers = async () => {
        try {
          const res = await fetch("/api/servers");
          if (!res.ok) return;
          const servers = await res.json();
          renderServers(Array.isArray(servers) ? servers : []);
        } catch (err) {
          return;
        }
      };

      refreshServers();
      setInterval(refreshServers, 4000);
    </script>
  </body>
</html>
